name: CI/CD Dingxin Symotech — Manual Deploy ke cPanel

# Hanya berjalan ketika dipicu secara manual (tidak berjalan otomatis saat push git)
on:
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, sqlite3, pdo_sqlite, mbstring, intl, zip, json, gd
          tools: composer:v2

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction

      - name: 🧪 Run PHPUnit Test Suite
        run: php artisan test

  deploy:
    name: 🚀 Deploy ke cPanel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy ke cPanel & Verifikasi (via Python FTPS Deployer)
        run: python3 scripts/cpanel_deploy.py
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
